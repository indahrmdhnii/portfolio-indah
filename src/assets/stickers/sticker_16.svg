<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs><g id="art" stroke-linejoin="round" stroke-linecap="round"><rect x="24" y="24" width="72" height="50" rx="7" fill="#8B5A65" />
<rect x="31" y="31" width="58" height="36" rx="3" fill="#FFF5F7" />
<path d="M37 60 L50 48 L60 54 L82 37" stroke="#C2607A" stroke-width="4" fill="none" />
<path d="M12 78 H108 L100 92 H20 Z" fill="#C88B95" /></g><g id="art3d" stroke-linejoin="round" stroke-linecap="round"><rect x="24" y="24" width="72" height="50" rx="7" fill="#8B5A65" filter="url(#clay)" /><rect x="31" y="31" width="58" height="36" rx="3" fill="#FFF5F7" filter="url(#clay)" /><path d="M37 60 L50 48 L60 54 L82 37" stroke="#C2607A" stroke-width="4" fill="none" filter="url(#clay)" /><path d="M12 78 H108 L100 92 H20 Z" fill="#C88B95" filter="url(#clay)" /></g><filter id="clay" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="bump" />
<feSpecularLighting in="bump" surfaceScale="5" specularConstant="0.9" specularExponent="38" lighting-color="#ffffff" result="spec"><feDistantLight azimuth="225" elevation="48" /></feSpecularLighting>
<feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn" />
<feOffset in="SourceAlpha" dx="-2.2" dy="-2.8" result="up" />
<feComposite in="SourceAlpha" in2="up" operator="out" result="rim" />
<feGaussianBlur in="rim" stdDeviation="1.6" result="rimBlur" />
<feFlood flood-color="#3A1F2A" flood-opacity="0.38" />
<feComposite in2="rimBlur" operator="in" result="shade0" />
<feComposite in="shade0" in2="SourceAlpha" operator="in" result="shade" />
<feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.75" k4="0" result="lit" />
<feMerge><feMergeNode in="lit" /><feMergeNode in="shade" /></feMerge>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b" />
<feOffset in="b" dy="4" result="o" />
<feFlood flood-color="#8B5A65" flood-opacity="0.35" />
<feComposite in2="o" operator="in" result="drop" />
<feSpecularLighting in="b" surfaceScale="3" specularConstant="0.5" specularExponent="12" lighting-color="#ffffff" result="s"><feDistantLight azimuth="225" elevation="55" /></feSpecularLighting>
<feComposite in="s" in2="SourceAlpha" operator="in" result="sIn" />
<feComposite in="SourceGraphic" in2="sIn" operator="arithmetic" k2="1" k3="0.4" result="lit" />
<feMerge><feMergeNode in="drop" /><feMergeNode in="lit" /></feMerge>
</filter></defs>
<use href="#art" stroke="#ffffff" stroke-width="12" filter="url(#lift)" />
<use href="#art3d" />
</svg>