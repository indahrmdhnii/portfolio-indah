<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs><g id="art" stroke-linejoin="round" stroke-linecap="round"><path d="M40 14 L58 14 L66 50 L48 50 Z" fill="#C2607A" />
