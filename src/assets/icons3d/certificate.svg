<circle cx="84" cy="74" r="8" fill="#FFE08A" /></g><g id="art3d" stroke-linejoin="round" stroke-linecap="round"><rect x="16" y="22" width="88" height="66" rx="8" fill="#FFF5F7" filter="url(#clay)" /><rect x="16" y="22" width="88" height="66" rx="8" fill="none" stroke="#EABEC3" stroke-width="5" filter="url(#clay)" /><rect x="30" y="38" width="44" height="6" rx="3" fill="#C2607A" filter="url(#clay)" /><rect x="30" y="52" width="34" height="5" rx="2.5" fill="#D9A5AC" filter="url(#clay)" /><path d="M78 80 L74 104 L84 97 L94 104 L90 80 Z" fill="#C2607A" filter="url(#clay)" /><circle cx="84" cy="74" r="14" fill="#F6C453" filter="url(#clay)" /><circle cx="84" cy="74" r="8" fill="#FFE08A" filter="url(#clay)" /></g><filter id="clay" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="bump" />
<feSpecularLighting in="bump" surfaceScale="5" specularConstant="0.9" specularExponent="38" lighting-color="#ffffff" result="spec"><feDistantLight azimuth="225" elevation="48" /></feSpecularLighting>
<feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn" />
