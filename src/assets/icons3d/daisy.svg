<circle cx="57" cy="55" r="9" fill="#FFD976" /></g><g id="art3d" stroke-linejoin="round" stroke-linecap="round"><path d="M60 92 C 58 102, 56 108, 52 114" fill="none" stroke="#7DBE73" stroke-width="5" filter="url(#clay)" /><path d="M56 104 C 44 98, 34 102, 30 110 C 40 114, 50 112, 56 104 Z" fill="#8CCB7E" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(0 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(30 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(60 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(90 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(120 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(150 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(180 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(210 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(240 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(270 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(300 60 58)" filter="url(#clay)" /><ellipse cx="60" cy="31" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(330 60 58)" filter="url(#clay)" /><circle cx="60" cy="58" r="15" fill="#F6C453" filter="url(#clay)" /><circle cx="57" cy="55" r="9" fill="#FFD976" filter="url(#clay)" /></g><filter id="clay" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="bump" />
<feSpecularLighting in="bump" surfaceScale="5" specularConstant="0.9" specularExponent="38" lighting-color="#ffffff" result="spec"><feDistantLight azimuth="225" elevation="48" /></feSpecularLighting>
<feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn" />
<feOffset in="SourceAlpha" dx="-2.2" dy="-2.8" result="up" />
<feComposite in="SourceAlpha" in2="up" operator="out" result="rim" />
<feGaussianBlur in="rim" stdDeviation="1.6" result="rimBlur" />
<feFlood flood-color="#3A1F2A" flood-opacity="0.38" />
<feComposite in2="rimBlur" operator="in" result="shade0" />
<feComposite in="shade0" in2="SourceAlpha" operator="in" result="shade" />
<feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.75" k4="0" result="lit" />
<feMerge><feMergeNode in="lit" /><feMergeNode in="shade" /></feMerge>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b" />
<feOffset in="b" dy="4" result="o" />
<feFlood flood-color="#8B5A65" flood-opacity="0.35" />
<feComposite in2="o" operator="in" result="drop" />
<feSpecularLighting in="b" surfaceScale="3" specularConstant="0.5" specularExponent="12" lighting-color="#ffffff" result="s"><feDistantLight azimuth="225" elevation="55" /></feSpecularLighting>
<feComposite in="s" in2="SourceAlpha" operator="in" result="sIn" />
<feComposite in="SourceGraphic" in2="sIn" operator="arithmetic" k2="1" k3="0.4" result="lit" />
<feMerge><feMergeNode in="drop" /><feMergeNode in="lit" /></feMerge>
</filter></defs>
<use href="#art" stroke="#F3D9DF" stroke-width="7" filter="url(#lift)" />
<use href="#art3d" />
