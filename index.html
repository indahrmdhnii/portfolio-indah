<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Indah Ramadhani — Business Analyst & Business Development for digital business. Analyze like a skeptic. Build like a believer." />
    <title>Indah Ramadhani</title>
    <!-- Hide the handwritten text for a moment until its web fonts are ready (removed in main.tsx, max 1.5s) -->
    <script>document.documentElement.classList.add('fonts-loading')</script>
    <style>
      /* Critical CSS for initial render - Above the fold styles */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: #FFFFFF;
        color: #8B5A65;
        line-height: 1.6;
      }
      /* Navigation critical styles */
      .navigation {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: rgba(255, 232, 239, 0.4);
        backdrop-filter: blur(20px);
        padding: 1rem 0;
      }
      .main-content { padding-top: 80px; }
      /* About section critical styles */
      .about-section {
        min-height: 100vh;
        background: linear-gradient(180deg, rgb(255 232 239) 0%, rgb(254 245 245) 100%);
        padding: 2rem 0;
      }
      .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
      .text-center { text-align: center; }
      /* Loading states for lazy components */
      .loading-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
        color: #6c757d;
      }
      /* Performance optimizations */
      .will-change-transform { will-change: transform; }
      .will-change-opacity { will-change: opacity; }
      .gpu-accelerated { transform: translateZ(0); }
      /* Optimize repaints and reflows */
      /* No content-visibility on images: iOS Safari skipped drawing images inside the 3D skills dome */
      /* Optimize animations - removed global transform-style that breaks fixed positioning */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
